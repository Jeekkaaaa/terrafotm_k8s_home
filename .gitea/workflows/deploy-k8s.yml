          echo "  kubectl --kubeconfig=./kubeconfig proxy"
          echo "  Затем открыть: http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy/"
          
          echo ""
          echo "========================================"
          echo "🚀 KUBERNETES КЛАСТЕР ГОТОВ К РАБОТЕ!"
          echo "========================================"