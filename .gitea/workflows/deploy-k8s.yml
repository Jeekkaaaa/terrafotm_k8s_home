          echo "📊 СТАТУС КЛАСТЕРА:"
          echo "----------------------------------------"
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key ubuntu@$MASTER_IP \
            "sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes -o wide"
          
          echo ""
          echo "📦 СИСТЕМНЫЕ PODS:"
          echo "----------------------------------------"
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key ubuntu@$MASTER_IP \
            "sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods -A | head -25"
          
          echo ""
          echo "🔗 КОМАНДЫ ДЛЯ ДОСТУПА:"
          echo "----------------------------------------"
          echo "  SSH Master:    ssh -i /tmp/ssh_key ubuntu@$MASTER_IP"
          echo "  Скачать конфиг: scp -i /tmp/ssh_key ubuntu@$MASTER_IP:/etc/kubernetes/admin.conf ./kubeconfig"
          echo "  Kubectl:       kubectl --kubeconfig=./kubeconfig get nodes"
          
          echo ""
          echo "📋 УСТАНОВЛЕННЫЕ КОМПОНЕНТЫ:"
          echo "----------------------------------------"
          echo "  ✅ Kubernetes $K8S_VERSION"
          echo "  ✅ Containerd"
          echo "  ✅ Calico CNI (через плейбук)"
          echo "  ✅ Metrics Server (через плейбук)"
          echo "  ✅ Kubernetes Dashboard (через плейбук)"
          echo "  ✅ Ingress Controller"
          echo "  ✅ Storage (Local Path Provisioner)"
          echo "  ✅ MetalLB Load Balancer"
          echo "  ✅ Helm"
          
          echo ""
          echo "🔧 КОНФИГУРАЦИЯ КЛАСТЕРА:"
          echo "----------------------------------------"
          echo "  Мастеров: $MASTERS_COUNT"
          echo "  Воркеров: $WORKERS_COUNT"
          echo "  Pod CIDR: $POD_CIDR"
          echo "  Service CIDR: ${{ needs.terraform-deploy.outputs.service_cidr }}"
          echo "  Cluster Domain: ${{ needs.terraform-deploy.outputs.cluster_domain }}"
          
